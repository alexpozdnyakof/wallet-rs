[package]
name = "bip39"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.4.3"
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
rpassword = "7.5.5"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
zeroize = "1.9.2"

[features]
# Для сборки под браузер/Node (wasm32-unknown-unknown): cargo build --features wasm-js
wasm-js = ["getrandom/wasm_js"]

[dev-dependencies]
serde_json = "1.0.154"
